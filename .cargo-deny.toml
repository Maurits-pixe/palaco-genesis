[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db/raw/main/db.json.gz"]
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"

[licenses]
preferred-license = ["MIT", "Apache-2.0", "Apache-2.0 OR MIT"]
allow = ["MIT", "Apache-2.0", "ISC", "OpenSSL"]
deny = ["GPL-2.0", "GPL-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "warn"
