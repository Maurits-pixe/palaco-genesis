[package]
name = "aether-engine"
edition = "2024"
version = "0.1.0-alpha.1"
license = "MIT"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
ring = "=0.17.14"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "libsqlite3-sys"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time"] }

[workspace]
