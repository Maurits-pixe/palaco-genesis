[workspace]
resolver = "2"
members = [
    "crates/palaco-foundation",
    "crates/palaco-eventbus",
    "crates/palaco-harbor",
    "crates/palaco-quay",
    "crates/palaco-citadel",
    "crates/palaco-federation",
    "crates/palaco-intelligence",
    "crates/palaco-evolution",
    "crates/palaco-constitution",
    "crates/palaco-types",
    "crates/palaco-errors",
    "crates/palaco-events",
    "crates/palaco-evidence",
    "crates/palaco-oracle",
    "crates/palaco-trias",
    "crates/palaco-knowledge",
    "crates/palaco-runtime",
    "crates/palaco-audit",
    "crates/palaco-observatory",
    "runtime/palaco-kernel",
    "crates/palaco-rio-core",
    "crates/palaco-office-event-contract",
    "crates/palaco-office-intake",
    "crates/palaco-calendar-intake",
    "crates/palaco-office-execution",
    "crates/palaco-rio-office",
    "crates/palaco-office-authorization",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["PALACO Core Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Maurits-pixe/palaco-genesis"
rust-version = "1.81"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

palaco-constitution = { path = "crates/palaco-constitution" }
palaco-types = { path = "crates/palaco-types" }
palaco-errors = { path = "crates/palaco-errors" }
palaco-events = { path = "crates/palaco-events" }
palaco-evidence = { path = "crates/palaco-evidence" }
palaco-oracle = { path = "crates/palaco-oracle" }
palaco-trias = { path = "crates/palaco-trias" }
palaco-knowledge = { path = "crates/palaco-knowledge" }
palaco-citadel = { path = "crates/palaco-citadel" }
palaco-runtime = { path = "crates/palaco-runtime" }
palaco-audit = { path = "crates/palaco-audit" }
palaco-observatory = { path = "crates/palaco-observatory" }
palaco-rio-core = { path = "crates/palaco-rio-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
