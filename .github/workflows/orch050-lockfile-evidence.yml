name: ORCH-050A lockfile evidence (temporary)
on:
  push:
    branches: [orch-050a-lockfile-evidence]
  pull_request:
    branches: [orch-050-ed25519-review-verifier]
permissions:
  contents: read
jobs:
  export-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate dependency lock without secrets
        run: cargo generate-lockfile
      - name: Print only generated public Cargo.lock data
        run: |
          echo 'PALACO_LOCKFILE_BEGIN'
          base64 -w0 Cargo.lock
          echo
          echo 'PALACO_LOCKFILE_END'
