name: ORCHEASTRA PostgreSQL isolated integration

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL CAS and rollback tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: palaco_test
          POSTGRES_PASSWORD: local_only_ci_test
          POSTGRES_DB: palaco_orcheastra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palaco_test -d palaco_orcheastra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PALACO_TEST_EPHEMERAL: "YES"
      PALACO_TEST_PG_URI: postgresql://palaco_test:local_only_ci_test@127.0.0.1:5432/palaco_orcheastra_test
      PGCONNECT_TIMEOUT: "5"

    steps:
      - name: Checkout untrusted draft branch
        uses: actions/checkout@v4

      - name: Install isolated PostgreSQL test client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply draft migration only to disposable CI database
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f docs/architecture/orcheastra-authority-postgres-v0.20.sql

      - name: Create isolated no-login privilege fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f scripts/orcheastra_postgres_test_roles.sql

      - name: Validate CAS concurrency revocation rollback and privileges
        run: python3 scripts/orcheastra_postgres_integration.py

      - name: Install authorization epoch candidate in ephemeral database
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f docs/architecture/orcheastra-authority-authz-v0.25.sql

      - name: Verify authorization revoke scope and rollback
        run: python3 scripts/orcheastra_postgres_authz_integration.py

      - name: Install session-bound publisher facade in disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f docs/architecture/orcheastra-authority-session-v0.26.sql

      - name: Install ordered revocation route in disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f docs/architecture/orcheastra-authority-ordering-v0.27.sql

      - name: Validate authenticated PostgreSQL session identity and restrictions
        env:
          PALACO_TEST_PUBLISHER_URI: postgresql://palaco_audit_ci_publisher:local_only_ci_publisher@127.0.0.1:5432/palaco_orcheastra_test
        run: python3 scripts/orcheastra_postgres_session_integration.py

      - name: Install key-policy lock ordering and deletion guards
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f docs/architecture/orcheastra-authority-key-policy-v0.28.sql

      - name: Verify key rotation revocation races and deletion protection
        env:
          PALACO_TEST_PUBLISHER_URI: postgresql://palaco_audit_ci_publisher:local_only_ci_publisher@127.0.0.1:5432/palaco_orcheastra_test
        run: python3 scripts/orcheastra_postgres_key_policy_integration.py

      - name: Install transactional policy evidence in disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f docs/architecture/orcheastra-policy-evidence-v0.29.sql

      - name: Verify policy changes rollback and tamper denial
        env:
          PALACO_TEST_PUBLISHER_URI: postgresql://palaco_audit_ci_publisher:local_only_ci_publisher@127.0.0.1:5432/palaco_orcheastra_test
        run: python3 scripts/orcheastra_postgres_policy_evidence.py

      - name: Install SHA-256 policy evidence hash chain
        run: |
          psql -X -v ON_ERROR_STOP=1 "$PALACO_TEST_PG_URI" \
            -f docs/architecture/orcheastra-policy-hash-v0.30.sql

      - name: Independently verify and pin policy hash heads
        run: python3 scripts/orcheastra_policy_hash_verify.py --pin

      - name: Seal policy heads with isolated ephemeral Ed25519 key
        run: python3 scripts/orcheastra_policy_signed_checkpoint.py --seal

      - name: Exercise root-authorized rotation and pinned trust version
        run: python3 scripts/orcheastra_policy_trust_rotation.py --seal

      - name: Seal scoped key statuses and trusted checkpoint registry
        run: python3 scripts/orcheastra_trust_registry_v033.py --seal

      - name: Test fail-closed recovery dispositions without execution
        run: python3 scripts/orcheastra_recovery_disposition_v034.py --test

      - name: Generate and adversarially verify read-only recovery report
        run: python3 scripts/orcheastra_recovery_report_v035.py --create

      - name: Sign portable recovery bundle and run offline tamper tests
        run: python3 scripts/orcheastra_recovery_bundle_v036.py --create

      - name: Restart only the ephemeral PostgreSQL CI service
        run: |
          docker restart "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 40); do
            if pg_isready -d "$PALACO_TEST_PG_URI" -q; then
              exit 0
            fi
            sleep 1
          done
          echo "Ephemeral PostgreSQL service failed to restart" >&2
          exit 1

      - name: Verify committed history and revocation after restart
        run: python3 scripts/orcheastra_postgres_integration.py --verify-restart

      - name: Verify policy hash heads after restart
        run: python3 scripts/orcheastra_policy_hash_verify.py --verify

      - name: Verify signed policy heads after PostgreSQL restart
        run: python3 scripts/orcheastra_policy_signed_checkpoint.py --verify

      - name: Verify rotated trust and anti-rollback after PostgreSQL restart
        run: python3 scripts/orcheastra_policy_trust_rotation.py --verify

      - name: Verify signed key statuses and recovery gate after restart
        run: python3 scripts/orcheastra_trust_registry_v033.py --verify

      - name: Verify non-executing recovery disposition after restart
        run: python3 scripts/orcheastra_recovery_disposition_v034.py --verify

      - name: Reproduce and verify recovery report after database restart
        run: python3 scripts/orcheastra_recovery_report_v035.py --verify

      - name: Verify portable Ed25519 report and original evidence after restart
        run: python3 scripts/orcheastra_recovery_bundle_v036.py --verify
