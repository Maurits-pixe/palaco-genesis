name: PALACO Automation Integrity

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: palaco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-automation-files:
    name: Validate workflows and scripts
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow YAML files and CI policy guardrails
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml
          
          files = sorted(glob.glob(".github/workflows/*.yml"))
          errors = []
          
          for path in files:
              with open(path, "r", encoding="utf-8") as fh:
                  data = yaml.safe_load(fh)
          
              if not isinstance(data, dict):
                  errors.append(f"{path}: workflow root must be a mapping")
                  continue
          
              concurrency = data.get("concurrency")
              if not isinstance(concurrency, dict):
                  errors.append(f"{path}: missing top-level concurrency mapping")
              else:
                  group = concurrency.get("group")
                  cancel = concurrency.get("cancel-in-progress")
                  if not group:
                      errors.append(f"{path}: concurrency.group is missing or empty")
                  if cancel is not True:
                      errors.append(f"{path}: concurrency.cancel-in-progress must be true")
          
              jobs = data.get("jobs")
              if not isinstance(jobs, dict) or not jobs:
                  errors.append(f"{path}: jobs mapping is missing or empty")
                  continue
          
              for job_name, job in jobs.items():
                  if not isinstance(job, dict):
                      errors.append(f"{path}: job '{job_name}' must be a mapping")
                      continue
          
                  timeout = job.get("timeout-minutes")
                  if not isinstance(timeout, int) or timeout <= 0:
                      errors.append(
                          f"{path}: job '{job_name}' must define positive timeout-minutes"
                      )
          
              print(f"OK {path}")
          
          if errors:
              for err in errors:
                  print(err)
              sys.exit(1)
          PY

      - name: Validate shell script syntax
        run: |
          for script in .github/scripts/*.sh; do
            bash -n "$script"
            echo "OK $script"
          done

      - name: Run shellcheck for workflow scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck .github/scripts/*.sh
