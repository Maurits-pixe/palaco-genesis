name: PALACO Automation Integrity

on:
  workflow_dispatch: {}
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: palaco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-automation-files:
    name: Validate workflows and scripts
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow YAML files and CI policy guardrails
        run: |
          python .github/scripts/validate-workflows.py

      - name: Validate shell script syntax
        run: |
          for script in .github/scripts/*.sh; do
            bash -n "$script"
            echo "OK $script"
          done

      - name: Validate Python script syntax
        run: |
          python -m py_compile .github/scripts/*.py
          for script in .github/scripts/*.py; do
            echo "OK $script"
          done

      - name: Run shellcheck for workflow scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck .github/scripts/*.sh
