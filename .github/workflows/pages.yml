name: PALACO Pages

on:
  workflow_dispatch:
    inputs:
      custom_domain:
        description: "Optional custom domain override for this run (e.g. docs.example.com)"
        required: false
        type: string
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site/docs
          cp -R docs/. _site/docs/
          cp README.md _site/README.md
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>PALACO Genesis</title>
          </head>
          <body>
            <h1>PALACO Genesis</h1>
            <p>Repository documentation entrypoint.</p>
            <ul>
              <li><a href="./README.md">README.md</a></li>
              <li><a href="./docs/">docs/</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Resolve custom domain
        id: custom_domain
        shell: bash
        env:
          INPUT_CUSTOM_DOMAIN: ${{ github.event.inputs.custom_domain }}
          REPO_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          domain="${INPUT_CUSTOM_DOMAIN:-$REPO_CUSTOM_DOMAIN}"
          domain="$(echo "$domain" | xargs)"
          if [ -n "$domain" ] && [[ ! "$domain" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid custom domain value: $domain"
            exit 1
          fi
          echo "custom_domain=$domain" >> "$GITHUB_OUTPUT"

      - name: Apply custom domain (optional)
        if: ${{ steps.custom_domain.outputs.custom_domain != '' }}
        run: echo "${{ steps.custom_domain.outputs.custom_domain }}" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
