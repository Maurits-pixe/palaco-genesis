name: PALACO CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-features

      - name: Test PVC-001 validator
        run: python3 -m unittest discover -s validation -p 'test_*.py'

      - name: Generate PVC-001 evidence
        run: python3 validation/pvc_validate.py --output-dir "$RUNNER_TEMP/pvc-evidence"

      - name: Upload PVC-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvc-001-evidence
          path: ${{ runner.temp }}/pvc-evidence/
          if-no-files-found: warn
