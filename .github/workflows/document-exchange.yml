name: PALACO Document Exchange

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: palaco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-link-integrity:
    name: Validate documentation links
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate relative markdown links
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          markdown_files = [*root.glob("README.md"), *root.glob("docs/**/*.md")]
          link_pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          broken = []

          for md_file in markdown_files:
              text = md_file.read_text(encoding="utf-8")
              for raw_target in link_pattern.findall(text):
                  target = raw_target.strip()
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#", 1)[0]
                  if not target:
                      continue
                  candidate = (md_file.parent / target).resolve()
                  if not candidate.exists():
                      broken.append((md_file.relative_to(root), raw_target))

          if broken:
              for md, target in broken:
                  print(f"broken link in {md}: {target}")
              sys.exit(1)

          print("All relative markdown links resolve.")
          PY
