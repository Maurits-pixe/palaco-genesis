name: Citadel A1 interoperability
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read

concurrency:
  group: palaco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verifiers:
    name: Independent verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run contract tests
        run: cargo test --locked -p palaco-citadel-contracts
      - name: Build contract binaries
        run: cargo build --locked -p palaco-citadel-contracts --bins
      - name: Independent Python verification and cross-language mutation matrix
        env:
          CITADEL_A1_BINARY: ${{ github.workspace }}/target/debug/citadel-a1
          CITADEL_A1_CANONICAL_BINARY: ${{ github.workspace }}/target/debug/citadel-a1-canonical
        run: python3 tools/citadel_a1/test_verify.py
