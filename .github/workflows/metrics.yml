name: PALACO Metrics

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: palaco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-metrics:
    name: Compare dependency metrics
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run metrics comparison
        run: |
          chmod +x .github/scripts/compare-metrics.sh
          .github/scripts/compare-metrics.sh metrics/baseline.json metrics/metrics-report.md

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: metrics/metrics-report.md
