name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p palaco-citadel-contracts --release --bins
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/citadel-a1
            target/release/citadel-a1-canonical

  publish-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/citadel-a1
            release-assets/citadel-a1-canonical
