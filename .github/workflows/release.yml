name: PALACO Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (bijv. v0.1.0)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: palaco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Release readiness checks
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Validate Cargo Metadata
        run: cargo metadata --format-version=1 --no-deps > /dev/null

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-features

      - name: Capture release context
        run: |
          mkdir -p release-evidence
          {
            echo "release_tag=${{ github.event.inputs.release_tag }}"
            echo "commit=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
          } > release-evidence/context.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/

  build-binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release-readiness

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build palaco-citadel-contracts binaries
        run: cargo build --release -p palaco-citadel-contracts --bins

      - name: Prepare release binaries
        run: |
          mkdir -p release-binaries
          cp target/release/citadel-a1 release-binaries/
          cp target/release/citadel-a1-canonical release-binaries/

      - name: Generate checksums and manifest
        run: |
          sha256sum release-binaries/citadel-a1 > release-binaries/SHA256SUMS
          sha256sum release-binaries/citadel-a1-canonical >> release-binaries/SHA256SUMS
          cat > release-binaries/release-manifest.json <<'JSON'
          {
            "artifacts": [
              "citadel-a1",
              "citadel-a1-canonical",
              "SHA256SUMS"
            ],
            "source_package": "palaco-citadel-contracts",
            "workflow": "release.yml"
          }
          JSON

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release-binaries/

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-binaries
    if: ${{ github.event.inputs.release_tag != '' }}
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release-binaries

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: |
            release-binaries/citadel-a1
            release-binaries/citadel-a1-canonical
            release-binaries/SHA256SUMS
            release-binaries/release-manifest.json
