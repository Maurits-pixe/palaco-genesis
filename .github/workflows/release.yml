name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      - run: cargo build -p palaco-citadel-contracts --release --bins
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: |
            target/release/citadel-a1
            target/release/citadel-a1-canonical

  publish-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-binaries
          path: release-assets
      - uses: softprops/action-gh-release@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          files: |
            release-assets/citadel-a1
            release-assets/citadel-a1-canonical
