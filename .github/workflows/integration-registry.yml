name: PALACO Integration Registry Contract

on:
  pull_request:
    paths:
      - 'ecosystem/integration-registry.v0.1.json'
      - 'ecosystem/boundary-contract.v0.1.json'
      - 'ecosystem/offline-recovery-policy.v0.1.json'
      - 'tools/validate_integration_registry.py'
      - 'tools/strict_contract_json.py'
      - 'tools/contract_digest.py'
      - 'tests/test_contract_digest.py'
      - 'tests/test_contract_digest_vectors.py'
      - 'tools/verify_contract_vectors.mjs'
      - 'verification/contract-digest-v0-vectors.json'
      - 'verification/contract-digest-v0-negative.json'
      - 'tests/test_contract_digest_negative.py'
      - 'tests/test_strict_contract_json.py'
      - 'tools/validate_boundary_contract.py'
      - 'tools/validate_offline_recovery.py'
      - 'tests/test_integration_registry.py'
      - 'tests/test_boundary_contract.py'
      - 'tests/test_offline_recovery.py'
      - 'tests/test_local_evidence_intake.py'
      - 'tools/local_evidence_intake.py'
      - 'tools/local_replay_index.py'
      - 'tests/test_local_replay_index.py'
      - 'tools/signed_evidence_envelope.py'
      - 'tests/test_signed_evidence_envelope.py'
      - 'tools/signed_replay_pipeline.py'
      - 'tests/test_signed_replay_pipeline.py'
      - '.github/workflows/integration-registry.yml'
  push:
    branches: [main]
    paths:
      - 'ecosystem/integration-registry.v0.1.json'
      - 'ecosystem/boundary-contract.v0.1.json'
      - 'ecosystem/offline-recovery-policy.v0.1.json'
      - 'tools/validate_integration_registry.py'
      - 'tools/strict_contract_json.py'
      - 'tools/contract_digest.py'
      - 'tests/test_contract_digest.py'
      - 'tests/test_contract_digest_vectors.py'
      - 'tools/verify_contract_vectors.mjs'
      - 'verification/contract-digest-v0-vectors.json'
      - 'verification/contract-digest-v0-negative.json'
      - 'tests/test_contract_digest_negative.py'
      - 'tests/test_strict_contract_json.py'
      - 'tools/validate_boundary_contract.py'
      - 'tools/validate_offline_recovery.py'
      - 'tests/test_integration_registry.py'
      - 'tests/test_boundary_contract.py'
      - 'tests/test_offline_recovery.py'
      - 'tests/test_local_evidence_intake.py'
      - 'tools/local_evidence_intake.py'
      - 'tools/local_replay_index.py'
      - 'tests/test_local_replay_index.py'
      - 'tools/signed_evidence_envelope.py'
      - 'tests/test_signed_evidence_envelope.py'
      - 'tools/signed_replay_pipeline.py'
      - 'tests/test_signed_replay_pipeline.py'
      - '.github/workflows/integration-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    name: Verify integration and security contracts (HOLD)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned signature verification dependency
        run: python3 -m pip install cryptography==44.0.3
      - name: Validate integration registry
        run: python3 tools/validate_integration_registry.py
      - name: Validate fail-closed interface contract
        run: python3 tools/validate_boundary_contract.py
      - name: Validate offline evidence recovery policy
        run: python3 tools/validate_offline_recovery.py
      - name: Run positive and negative contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Setup independent Node.js verifier
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned canonical bytes and hashes independently
        run: node tools/verify_contract_vectors.mjs
