name: PALACO Bluetooth offline transfer tests

on:
  pull_request:
    paths:
      - "tools/bluetooth_transfer/**"
      - ".github/workflows/bluetooth-transfer-tests.yml"
  push:
    branches:
      - main
    paths:
      - "tools/bluetooth_transfer/**"
      - ".github/workflows/bluetooth-transfer-tests.yml"

permissions:
  contents: read

jobs:
  bluetooth-stdlib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed Ed25519 dependency
        run: python -m pip install "cryptography>=44,<49"
      - name: Compile-check reference modules
        run: python -m compileall -q tools/bluetooth_transfer
      - name: Run offline Bluetooth framing regressions
        working-directory: tools/bluetooth_transfer
        run: python -m unittest -v test_protocol.py test_session.py test_ble_frames.py test_ble_sender.py test_transport_gate.py test_native_adapter_contract.py test_receive_watchdog.py test_send_watchdog.py test_durable_replay.py test_replay_checkpoint.py test_receipt_integrity.py test_recovery_inspection.py test_serialized_receipts.py test_recovery_evidence.py test_signed_review_gate.py test_review_challenges.py test_ed25519_review_verifier.py test_signed_reviewer_policy.py test_protected_policy_gate.py test_review_intake.py test_anchored_challenges.py test_anchored_review_intake.py test_native_checkpoint_scope.py test_platform_checkpoint_bridge.py test_attested_native_checkpoint.py test_independent_checkpoint_witness.py test_durable_hold_gate.py test_native_fencing_gate.py test_sqlite_fencing_reference.py test_sqlite_fencing_multiprocess.py test_witnessed_sqlite_fencing.py test_witnessed_sqlite_crash.py test_fencing_incident_evidence.py test_signed_fencing_incident.py test_incident_reviewer_registry.py test_versioned_incident_policy.py test_signed_policy_distribution.py test_publisher_rotation_gate.py test_native_policy_custody.py test_native_policy_review_session.py test_native_platform_readiness.py test_windows_native_intake.py test_windows_native_ipc_contract.py test_windows_native_correlation.py test_windows_service_admission.py

  windows-native-host:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows-only diagnostic host
        run: dotnet build tools/bluetooth_transfer/windows_native_host/Palaco.Bluetooth.NativeHost.csproj --configuration Release --warnaserror
      - name: Run non-hardware diagnostic self-checks
        run: dotnet run --no-build --configuration Release --project tools/bluetooth_transfer/windows_native_host/Palaco.Bluetooth.NativeHost.csproj -- --self-test
      - name: Run real Windows local pipe integration (deny-only)
        run: dotnet run --no-build --configuration Release --project tools/bluetooth_transfer/windows_native_host/Palaco.Bluetooth.NativeHost.csproj -- --ipc-integration-test
      - name: Run separate-process Windows IPC interrupt and restart regressions
        run: dotnet run --no-build --configuration Release --project tools/bluetooth_transfer/windows_native_host/Palaco.Bluetooth.NativeHost.csproj -- --ipc-process-test
      - name: Verify Windows cross-account ACL denial (ephemeral non-admin account)
        shell: pwsh
        run: ./tools/bluetooth_transfer/windows_native_host/test_cross_account.ps1
