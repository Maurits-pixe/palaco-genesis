name: PALACO Bluetooth offline transfer tests

on:
  pull_request:
    paths:
      - "tools/bluetooth_transfer/**"
      - ".github/workflows/bluetooth-transfer-tests.yml"
  push:
    branches:
      - main
    paths:
      - "tools/bluetooth_transfer/**"
      - ".github/workflows/bluetooth-transfer-tests.yml"

permissions:
  contents: read

jobs:
  bluetooth-stdlib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed Ed25519 dependency
        run: python -m pip install "cryptography>=44,<49"
      - name: Compile-check reference modules
        run: python -m compileall -q tools/bluetooth_transfer
      - name: Run offline Bluetooth framing regressions
        working-directory: tools/bluetooth_transfer
        run: python -m unittest -v test_protocol.py test_session.py test_ble_frames.py test_ble_sender.py test_transport_gate.py test_native_adapter_contract.py test_receive_watchdog.py test_send_watchdog.py test_durable_replay.py test_replay_checkpoint.py test_receipt_integrity.py test_recovery_inspection.py test_serialized_receipts.py test_recovery_evidence.py test_signed_review_gate.py test_review_challenges.py test_ed25519_review_verifier.py
