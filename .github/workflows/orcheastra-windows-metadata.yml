name: ORCHEASTRA Windows metadata regression

on:
  pull_request:
    paths:
      - "verification/provenance/generate_sbom.py"
      - "verification/provenance/windows_metadata.py"
      - "verification/provenance/test_generate_sbom.py"
      - "verification/provenance/test_windows_metadata.py"
      - "verification/provenance/windows_metadata_name.py"
      - "verification/provenance/test_windows_metadata_name.py"
      - "verification/provenance/windows_build_root_test_adapter.py"
      - "verification/provenance/test_windows_build_root_adapter.py"
      - "verification/provenance/windows_native_relative_test_open.py"
      - "verification/provenance/test_windows_native_relative_open.py"
      - "verification/provenance/test_windows_native_relative_races.py"
      - "verification/provenance/test_windows_native_content_origin.py"
      - "verification/provenance/windows_test_pinned_digest.py"
      - "verification/provenance/test_windows_test_pinned_digest.py"
      - "verification/provenance/windows_test_lease_model.py"
      - "verification/provenance/test_windows_test_lease_model.py"
      - "verification/provenance/windows_test_sqlite_lease_ledger.py"
      - "verification/provenance/test_windows_test_sqlite_lease_ledger.py"
      - "verification/provenance/test_windows_test_sqlite_lease_process_crash.py"
      - "verification/provenance/test_windows_test_sqlite_storage_faults.py"
      - "verification/provenance/windows_test_sqlite_integrity.py"
      - "verification/provenance/test_windows_test_sqlite_integrity.py"
      - "verification/provenance/windows_test_sqlite_pinned_snapshot.py"
      - "verification/provenance/test_windows_test_sqlite_pinned_snapshot.py"
      - "verification/provenance/windows_test_pin_custody_model.py"
      - "verification/provenance/test_windows_test_pin_custody_model.py"
      - "verification/provenance/windows_test_sqlite_pin_custody.py"
      - "verification/provenance/test_windows_test_sqlite_pin_custody.py"
      - "verification/provenance/test_windows_test_pin_custody_process_crash.py"
      - "verification/provenance/test_windows_test_pin_custody_corruption.py"
      - "verification/provenance/test_windows_test_pin_custody_replacement.py"
      - "verification/provenance/test_windows_test_pin_custody_inread_race.py"
      - "verification/provenance/windows_test_custody_file_identity.py"
      - "verification/provenance/test_windows_test_custody_file_identity.py"
      - "verification/provenance/windows_test_anchor_adapter.py"
      - "verification/provenance/test_windows_test_anchor_adapter.py"
      - "verification/provenance/WNRA_05A_ANCHOR_VECTORS.json"
      - "verification/provenance/test_windows_anchor_canonical_vectors.py"
      - "verification/provenance/test_windows_anchor_vectors_node.cjs"
      - "verification/provenance/windows_test_anchor_raw_bytes.py"
      - "verification/provenance/test_windows_anchor_raw_bytes.py"

      - "verification/provenance/test_windows_anchor_raw_bytes_node.cjs"
      - "verification/provenance/WNRA_05F_SHARED_DENY_CORPUS.json"
      - "verification/provenance/test_windows_anchor_error_codes.py"
      - "verification/provenance/test_windows_anchor_process_isolation.py"
      - "verification/provenance/test_windows_anchor_job_objects.py"
      - "verification/provenance/test_windows_anchor_suspended_job_launch.py"
      - "verification/provenance/test_windows_anchor_token_audit.py"
      - "verification/provenance/test_windows_anchor_restricted_token.py"
      - "verification/provenance/test_windows_anchor_low_token_job_launch.py"
      - "verification/provenance/test_windows_anchor_restricted_sid_worker.py"
      - "verification/provenance/test_windows_anchor_restricted_sid_access_diagnostics.py"
      - "verification/provenance/test_windows_anchor_restricted_sid_image_probe.py"
      - "verification/provenance/test_windows_anchor_readonly_access_check.py"
      - "verification/provenance/test_windows_anchor_restricted_sid_object_open.py"
      - "verification/provenance/test_windows_anchor_restricted_sid_loader_path.py"
      - "verification/provenance/test_windows_anchor_process_bound_failure.py"
      - ".github/workflows/orcheastra-windows-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-metadata:
    name: Windows native handle and descriptor checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run metadata regression suite on native Windows
        shell: pwsh
        run: |
          python -m unittest discover -s verification/provenance -p test_generate_sbom.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_metadata.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_metadata_name.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_build_root_adapter.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_native_relative_open.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_native_relative_races.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_native_content_origin.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_pinned_digest.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_lease_model.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_sqlite_lease_ledger.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_sqlite_lease_process_crash.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_sqlite_storage_faults.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_sqlite_integrity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_sqlite_pinned_snapshot.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_pin_custody_model.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_sqlite_pin_custody.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_pin_custody_process_crash.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_pin_custody_corruption.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_pin_custody_replacement.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_pin_custody_inread_race.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_custody_file_identity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_test_anchor_adapter.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_canonical_vectors.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test verification/provenance/test_windows_anchor_vectors_node.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_raw_bytes.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test verification/provenance/test_windows_anchor_raw_bytes_node.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_error_codes.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_process_isolation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_job_objects.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_suspended_job_launch.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_token_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_restricted_token.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_low_token_job_launch.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_restricted_sid_worker.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_restricted_sid_access_diagnostics.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_restricted_sid_image_probe.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_readonly_access_check.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_restricted_sid_object_open.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_restricted_sid_loader_path.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_anchor_process_bound_failure.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
