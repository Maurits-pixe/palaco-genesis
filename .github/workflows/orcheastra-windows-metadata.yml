name: ORCHEASTRA Windows metadata regression

on:
  pull_request:
    paths:
      - "verification/provenance/generate_sbom.py"
      - "verification/provenance/windows_metadata.py"
      - "verification/provenance/test_generate_sbom.py"
      - "verification/provenance/test_windows_metadata.py"
      - "verification/provenance/windows_metadata_name.py"
      - "verification/provenance/test_windows_metadata_name.py"
      - "verification/provenance/windows_build_root_test_adapter.py"
      - "verification/provenance/test_windows_build_root_adapter.py"
      - "verification/provenance/windows_native_relative_test_open.py"
      - "verification/provenance/test_windows_native_relative_open.py"
      - "verification/provenance/test_windows_native_relative_races.py"
      - "verification/provenance/test_windows_native_content_origin.py"
      - ".github/workflows/orcheastra-windows-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-metadata:
    name: Windows native handle and descriptor checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run metadata regression suite on native Windows
        shell: pwsh
        run: |
          python -m unittest discover -s verification/provenance -p test_generate_sbom.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_metadata.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_metadata_name.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_build_root_adapter.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_native_relative_open.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_native_relative_races.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s verification/provenance -p test_windows_native_content_origin.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
