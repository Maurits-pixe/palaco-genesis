name: PALACO CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Architecture Validation — workspace
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Architecture Validation — foundational boundaries
        run: python3 scripts/verify_core_boundaries.py

      - name: Architecture Validation — negative tests
        run: python3 -m unittest discover -s tests -p 'test_architecture_boundaries.py'
