name: PALACO CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Architecture Validation
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Test PVC-001 validator
        run: python3 -m unittest discover -s validation -p 'test_*.py'

      - name: Generate PVC-001 evidence
        run: python3 validation/pvc_validate.py --output-dir "$RUNNER_TEMP/pvc-evidence"

      - name: Upload PVC-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvc-001-evidence
          path: ${{ runner.temp }}/pvc-evidence/
          if-no-files-found: warn
