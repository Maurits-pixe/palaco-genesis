name: Windows TPM readiness
on:
  pull_request:
  push:
    branches: ["orch-059-windows-tpm-readiness"]
permissions:
  contents: read
jobs:
  readiness:
    name: PowerShell readiness tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test read-only diagnostic
        shell: ${{ matrix.shell }}
        run: |
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/tools/windows/Get-PalacoTpmReadiness.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & ./tools/windows/Test-PalacoTpmReadiness.ps1
