name: Harbor recovery latency observation

on:
  pull_request:
    paths:
      - ".github/workflows/harbor-recovery-latency.yml"
      - ".github/scripts/validate_harbor_latency.py"
      - ".github/scripts/test_validate_harbor_latency.py"
      - ".github/scripts/verify_harbor_pr_head.py"
      - ".github/scripts/test_verify_harbor_pr_head.py"

permissions:
  contents: read

jobs:
  observe:
    name: Opt-in host-local recovery observation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Fail closed unless checked-out commit equals PR head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD)"
          python3 .github/scripts/verify_harbor_pr_head.py "$EXPECTED_HEAD_SHA" "$actual"

      - name: Verify guard accepts exact SHA and rejects mismatches
        shell: bash
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_harbor_pr_head.py' -v

      - name: Capture host and source envelope
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_image=${{ matrix.os }}"
            echo "kernel=$(uname -sr)"
            echo "filesystem=$(stat -f -c %T .)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "profile=test"
            echo "source_blob=$(git rev-parse HEAD:crates/palaco-harbor/src/local_anchor_floor_journal.rs)"
          } | tee harbor-latency-environment.txt

      - name: Run validator positive and negative regression tests
        shell: bash
        run: python3 -m unittest discover -s .github/scripts -p 'test_validate_harbor_latency.py' -v

      - name: Execute ignored benchmark and retain output
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p palaco-harbor --lib recovery_latency_characterization -- --ignored --nocapture 2>&1 | tee harbor-latency-raw.log
          python3 .github/scripts/validate_harbor_latency.py harbor-latency-raw.log harbor-latency-summary.txt
          cat harbor-latency-summary.txt
          sha256sum harbor-latency-environment.txt harbor-latency-raw.log harbor-latency-summary.txt | tee harbor-latency-digests.txt

      - name: Preserve measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-recovery-latency-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            harbor-latency-environment.txt
            harbor-latency-raw.log
            harbor-latency-summary.txt
            harbor-latency-digests.txt
          if-no-files-found: warn
          retention-days: 30
