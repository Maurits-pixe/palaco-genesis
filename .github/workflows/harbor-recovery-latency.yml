name: Harbor recovery latency observation

on:
  pull_request:
    paths:
      - ".github/workflows/harbor-recovery-latency.yml"

permissions:
  contents: read

jobs:
  observe:
    name: Opt-in host-local recovery observation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Capture host and source envelope
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "timestamp_utc=$(date -u +%FT%TZ)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_image=${{ matrix.os }}"
            echo "kernel=$(uname -sr)"
            echo "filesystem=$(stat -f -c %T .)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "profile=test"
            echo "source_blob=$(git rev-parse HEAD:crates/palaco-harbor/src/local_anchor_floor_journal.rs)"
          } | tee harbor-latency-environment.txt

      - name: Execute ignored benchmark and retain output
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p palaco-harbor --lib recovery_latency_characterization -- --ignored --nocapture 2>&1 | tee harbor-latency-raw.log
          python3 - <<'PY'
          import pathlib
          import re

          raw = pathlib.Path("harbor-latency-raw.log").read_text()
          lines = [line for line in raw.splitlines() if line.startswith("HARBOR_RECOVER ")]
          pattern = re.compile(
              r"HARBOR_RECOVER frames=(1|16|64) runs=7 "
              r"min_us=([0-9]+) median_us=([0-9]+) max_us=([0-9]+)"
          )
          if len(lines) != 3:
              raise SystemExit("expected exactly 3 recovery results")
          seen = set()
          for line in lines:
              match = pattern.fullmatch(line)
              if match is None:
                  raise SystemExit("malformed recovery result")
              frame, low, median, high = (int(value) for value in match.groups())
              if frame in seen or not low <= median <= high:
                  raise SystemExit("duplicate frame group or invalid duration ordering")
              seen.add(frame)
          if seen != {1, 16, 64}:
              raise SystemExit("missing recovery frame group")
          pathlib.Path("harbor-latency-summary.txt").write_text(
              "\\n".join(lines) + "\\n"
          )
          PY
          cat harbor-latency-summary.txt
          sha256sum harbor-latency-environment.txt harbor-latency-raw.log harbor-latency-summary.txt | tee harbor-latency-digests.txt

      - name: Preserve measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-recovery-latency-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            harbor-latency-environment.txt
            harbor-latency-raw.log
            harbor-latency-summary.txt
            harbor-latency-digests.txt
          if-no-files-found: warn
          retention-days: 30
