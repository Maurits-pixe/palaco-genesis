name: Draft registry contract checks
on:
  pull_request:
    paths:
      - 'release-registry/**'
      - '.github/workflows/registry-contract.yml'
permissions:
  contents: read

concurrency:
  group: palaco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Registry contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release-registry files
        uses: actions/checkout@v4
        with:
          sparse-checkout: release-registry
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run registry contract tests
        run: python -m unittest discover -s release-registry -p 'test_*.py' -v
